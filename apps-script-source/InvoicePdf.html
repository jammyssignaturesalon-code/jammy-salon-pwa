<!doctype html><html><head><meta charset="utf-8"><style>@page{size:A4;margin:17mm}body{font:11px Arial;color:#222}.head{border-bottom:3px solid #b89550;padding-bottom:14px}.brand{font:24px Georgia;color:#94712f}.muted{color:#666;line-height:1.5}.row{display:flex;justify-content:space-between;margin:20px 0}.tag{color:#987638;letter-spacing:1px}table{width:100%;border-collapse:collapse;margin-top:14px}th{background:#181818;color:#e0bd78;text-align:left;padding:10px}td{padding:10px;border-bottom:1px solid #ddd}.num{text-align:right}.summary{width:48%;margin:18px 0 0 auto}.summary td{border:0;padding:6px}.grand{font-size:16px;font-weight:bold;color:#94712f;border-top:2px solid #b89550}.foot{border-top:1px solid #ccc;margin-top:35px;padding-top:12px;text-align:center;color:#666}</style></head><body><div class="head"><div class="brand"><?= invoice.salon.name ?></div><div class="muted"><?= invoice.salon.address ?><br>Phone: <?= invoice.salon.phone ?><? if(invoice.salon.gstin){ ?> · GSTIN: <?= invoice.salon.gstin ?><? } ?></div></div><div class="row"><div><div class="tag">INVOICE / RECEIPT</div><h2><?= invoice.invoiceNo ?></h2><div class="muted"><?= invoice.date ?></div></div><div style="text-align:right"><b>Customer</b><br><?= invoice.customer.name ?><br><?= invoice.customer.phone ?><br><?= invoice.customer.membership ?></div></div><table><tr><th>Service</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Amount</th></tr><? invoice.items.forEach(function(x){ ?><tr><td><?= x.name ?></td><td class="num"><?= x.qty ?></td><td class="num">₹<?= x.price.toFixed(2) ?></td><td class="num">₹<?= x.amount.toFixed(2) ?></td></tr><? }); ?></table><table class="summary"><tr><td>Subtotal</td><td class="num">₹<?= invoice.subtotal.toFixed(2) ?></td></tr><tr><td>Discount</td><td class="num">- ₹<?= invoice.discount.toFixed(2) ?></td></tr><? if(invoice.gstRate){ ?><tr><td>GST (<?= invoice.gstRate ?>%)</td><td class="num">₹<?= invoice.tax.toFixed(2) ?></td></tr><? } ?><tr class="grand"><td>Total</td><td class="num">₹<?= invoice.total.toFixed(2) ?></td></tr><tr><td>Received</td><td class="num">₹<?= invoice.amountPaid.toFixed(2) ?></td></tr><tr><td>Balance</td><td class="num">₹<?= invoice.balance.toFixed(2) ?></td></tr><tr><td>Payment</td><td class="num"><?= invoice.paymentMethod ?></td></tr></table><? if(invoice.notes){ ?><p><b>Notes:</b> <?= invoice.notes ?></p><? } ?><div class="foot">Thank you for visiting Jammy's Signature Salon.</div></body></html>
